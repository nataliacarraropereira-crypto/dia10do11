[project]
name = "preparatorio-ufsc"
version = "0.1.0"
description = "Sistema web de gestão de cursinho preparatório para o vestibular da UFSC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.37.0",
    "sqlalchemy>=2.0.31",
    "pymysql>=1.1.1",
    "python-dotenv>=1.0.1",
    "dotenv>=0.9.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
